<html lang="ja"><head><meta charset="utf-8">

<title>学習アプリ</title>
<style>
:root{--bg:#f5f6f2;--panel:#fff;--ink:#1d2330;--muted:#4a5263;--line:#d9dfd9}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1d2330;--ink:#e8ebf1;--muted:#b8bfcc;--line:#343b48}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:28px 0 4px}
p{margin:0 0 12px;color:var(--muted)}
a.app{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}

a.app span{font-weight:600}

<h2>英語</h2><p>英語の合言葉で開きます。</p>

<a class="app" href="clinic/"><img src="clinic/icon-192.png" alt=""><span>病院・クリニックの英会話（受け入れる側）</span></a>
<a class="app" href="hotel/"><img src="hotel/icon-192.png" alt=""><span>ホテルの受付係の英会話（迎える側）</span></a>
