<script type="text/plain" class="app-js">
/* 学びの部品（どの講座でも共通）: 詳しい解説・間違えたときの対策・復習の箱・分野ごとのレーダーチャート・次にやる段
 *
 * 使い方（講座の画面の側）:
 *   const kit = LearnKit.create({ program, status, open, mount, focus, say });
 *     program: { programId, fields: {A:'分野名',...}, units: [{ id, field, level, title, learn, questions: [...] }] }
 *              選ぶ問 { q, choices, answer, explain, listen?, detail? } ／書く問 { type:'write', ... }
 *              detail = { why, wrong: {まちがいの選択肢の文: 違う理由}, tip, action, review: { unit, where } }
 *     status(id) → 'pass' | 'near' | 'fail' | 'skip' | 'todo'（その講座の合格の決め方）
 *     open(id)   → その段を開く（「読み直す所」のボタンで使う）
 *     mount      → 成績の板（レーダーチャート・次にやる段・復習の箱）を描く要素
 *     focus      → 段を開いた後に光らせて見せる所（既定 '.learn'＝要点）
 *     say(text)  → 英文を流す（無ければ聞くボタンを出さない）
 *   採点のとき: html += kit.feedback(q, 選んだ番号, 正解か)   採点が終わったら: kit.record(unit, [正解か...], [選んだ番号...])
 * 成績と復習の箱はこの端末のブラウザ（localStorage 'learn-kit-<programId>'）に残す。
 */
(function () {
  'use strict';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function create(opt) {
    const P = opt.program, focus = opt.focus || '.learn', KEY = 'learn-kit-' + (P.programId || P.name || 'x');
    const units = {}; P.units.forEach(u => { units[u.id] = u; });
    let st = { last: {}, box: {} };
    try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) st = Object.assign(st, v); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
    const qOf = k => { const [id, i] = k.split('#'); const u = units[id]; return u && u.questions[+i] ? { u, i: +i, q: u.questions[+i] } : null; };

    /* ---------- 詳しい解説と対策 ---------- */
    function feedback(q, chosen, ok) {
      const d = q.detail; if (!d) return '';
      let h = '<div class="lk-detail">';
      if (d.why) h += '<p><b>' + (q.type === 'write' ? '書き方の考え方' : '正解の理由') + '<\/b> ' + esc(d.why) + '<\/p>';
      const w = d.wrong || {}, mine = q.choices && chosen >= 0 && chosen !== q.answer ? q.choices[chosen] : null;
      if (mine && w[mine]) h += '<p class="lk-mine"><b>選んだ「' + esc(mine) + '」が違う理由<\/b> ' + esc(w[mine]) + '<\/p>';
      const others = Object.entries(w).filter(([c]) => c !== mine);
      if (others.length) h += '<details class="lk-others"><summary>' + (mine ? 'ほかの' : '') + 'まちがいの選択肢が違う理由<\/summary><ul>'
        + others.map(([c, t]) => '<li><b>' + esc(c) + '<\/b>：' + esc(t) + '<\/li>').join('') + '<\/ul><\/details>';
      if (d.tip) h += '<p><b>覚え方<\/b> ' + esc(d.tip) + '<\/p>';
      if (!ok) {
        const r = d.review || {}, ru = units[r.unit];
        h += '<div class="lk-fix"><p><b>対策<\/b> ' + esc(d.action || '') + '<\/p>';
        if (ru) h += '<p><b>読み直す所<\/b> ' + esc(ru.id + '「' + ru.title + '」') + (r.where ? ' の ' + esc(r.where) : '')
          + ' <button class="lk-btn" type="button" data-lk-go="' + esc(ru.id) + '">' + esc(ru.id) + ' を開いて読む<\/button><\/p>';
        if (q.choices) h += '<p class="lk-note">この問いは復習の箱に入りました。正解するまで出し直します。<\/p>';
        h += '<\/div>';
      }
      return h + '<\/div>';
    }
    function go(id) {
      opt.open(id);
      setTimeout(() => {
        const el = document.querySelector(focus); if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('lk-flash'); void el.offsetWidth; el.classList.add('lk-flash');
      }, 60);
    }
    document.addEventListener('click', e => { const b = e.target.closest('[data-lk-go]'); if (b) { e.preventDefault(); go(b.dataset.lkGo); } });

    /* ---------- 記録（1 問ごとの最後の結果と復習の箱） ---------- */
    function mark(k, ok) {
      st.last[k] = ok ? 1 : 0;
      if (ok) delete st.box[k]; else st.box[k] = { miss: ((st.box[k] || {}).miss || 0) + 1, at: Date.now() };
    }
    function record(u, res, chosen) {
      u.questions.forEach((q, i) => { if (q.choices && res[i] !== null && res[i] !== undefined) mark(u.id + '#' + i, !!res[i]); else if (res[i] !== null && res[i] !== undefined) st.last[u.id + '#' + i] = res[i] ? 1 : 0; });
      save(); draw();
    }

    /* ---------- 分野ごとの成績 ---------- */
    function stats() {
      return Object.entries(P.fields).map(([f, name]) => {
        const us = P.units.filter(u => u.field === f);
        let n = 0, c = 0; us.forEach(u => u.questions.forEach((q, i) => { const v = st.last[u.id + '#' + i]; if (v !== undefined) { n++; c += v; } }));
        const passed = us.filter(u => opt.status(u.id) === 'pass').length;
        return { f, name, rate: n ? c / n : 0, answered: n, reach: us.length ? passed / us.length : 0, passed, total: us.length };
      });
    }
    function nextUnit(S) {
      const tried = S.filter(s => s.answered), pool = (tried.length ? tried : S).slice().sort((a, b) => (a.rate + a.reach) - (b.rate + b.reach));
      for (const s of pool) {
        const u = P.units.filter(x => x.field === s.f).sort((a, b) => a.level - b.level).find(x => opt.status(x.id) !== 'pass' && opt.status(x.id) !== 'skip');
        if (u) return { u, s };
      }
      return null;
    }
    function radar(S) {
      const n = S.length, R = 92, cx = 160, cy = 130, pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; };
      const poly = vals => vals.map((v, i) => pt(i, Math.max(v, 0.02)).map(x => x.toFixed(1)).join(',')).join(' ');
      let g = '';
      [0.25, 0.5, 0.75, 1].forEach(r => { g += '<polygon class="lk-ring" points="' + poly(S.map(() => r)) + '"/>'; });
      S.forEach((s, i) => { const [x, y] = pt(i, 1); g += '<line class="lk-axis" x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>'; });
      g += '<polygon class="lk-reach" points="' + poly(S.map(s => s.reach)) + '"/>';
      g += '<polygon class="lk-rate" points="' + poly(S.map(s => s.rate)) + '"/>';
      S.forEach((s, i) => {
        const [x, y] = pt(i, 1.22), anchor = Math.abs(x - cx) < 8 ? 'middle' : (x > cx ? 'start' : 'end');
        g += '<text class="lk-lab" x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(s.f) + ' ' + (s.answered ? Math.round(s.rate * 100) + '%' : '—') + '<\/text>';
      });
      return '<svg class="lk-radar" viewBox="0 0 320 262" role="img" aria-label="分野ごとの正解率と到達度">' + g + '<\/svg>';
    }

    /* ---------- 成績の板 ---------- */
    let reviewing = false;
    function draw() {
      if (!opt.mount || reviewing) return;
      const S = stats(), nx = nextUnit(S), boxN = Object.keys(st.box).filter(qOf).length;
      let h = '<div class="lk-head"><h2>分野ごとの到達度<\/h2><span class="lk-sub">この端末に残しています<\/span><\/div><div class="lk-dash"><div>' + radar(S)
        + '<div class="lk-legend"><span><i class="lk-k-rate"><\/i>正解率（最後に解いた結果）<\/span><span><i class="lk-k-reach"><\/i>到達度（合格した段の割合）<\/span><\/div><\/div><div class="lk-side">';
      h += '<table class="lk-table"><thead><tr><th>分野<\/th><th>正解率<\/th><th>合格<\/th><\/tr><\/thead><tbody>'
        + S.map(s => '<tr><td>' + esc(s.f + ' ' + s.name) + '<\/td><td>' + (s.answered ? Math.round(s.rate * 100) + '%' : '—') + '<\/td><td>' + s.passed + '/' + s.total + '<\/td><\/tr>').join('') + '<\/tbody><\/table>';
      if (nx) h += '<div class="lk-next"><b>次にやる段<\/b> ' + esc(nx.u.id + '「' + nx.u.title + '」') + '<br><span class="lk-sub">' + (nx.s.answered ? 'いちばん伸びしろのある分野「' + esc(nx.s.name) + '」から' : 'まだ始めていない分野から') + '<\/span><br><button class="lk-btn" type="button" data-lk-open="' + esc(nx.u.id) + '">' + esc(nx.u.id) + ' を開く<\/button><\/div>';
      h += '<div class="lk-boxline"><b>復習の箱<\/b> ' + boxN + ' 問' + (boxN ? '<button class="lk-btn lk-strong" type="button" data-lk-review>復習する<\/button>' : '<span class="lk-sub">（間違えた問いがここにたまります）<\/span>') + '<\/div><\/div><\/div><div id="lk-review"><\/div>';
      opt.mount.innerHTML = h;
      const o = opt.mount.querySelector('[data-lk-open]'); if (o) o.addEventListener('click', () => opt.open(o.dataset.lkOpen));
      const r = opt.mount.querySelector('[data-lk-review]'); if (r) r.addEventListener('click', review);
    }

    /* ---------- 復習の箱（正解するまで出し直す） ---------- */
    function review() {
      reviewing = true;
      const keys = Object.keys(st.box).filter(qOf).sort((a, b) => st.box[b].miss - st.box[a].miss || st.box[a].at - st.box[b].at);
      const area = opt.mount.querySelector('#lk-review');
      let idx = 0;
      const show = () => {
        if (idx >= keys.length) { reviewing = false; draw(); const left = Object.keys(st.box).filter(qOf).length; const a = opt.mount.querySelector('#lk-review'); if (a) a.innerHTML = '<p class="lk-done">' + (left ? 'ひと回りしました。まだ ' + left + ' 問が箱に残っています。もう一度「復習する」で出し直します。' : '箱は空になりました。よくがんばりました！') + '<\/p>'; return; }
        const { u, i, q } = qOf(keys[idx]), ord = shuffle(q.choices.length);
        area.innerHTML = '<div class="lk-card"><div class="lk-sub">復習 ' + (idx + 1) + ' / ' + keys.length + '　' + esc(u.id + '「' + u.title + '」') + '<\/div><p><b>' + esc(q.q) + '<\/b><\/p>'
          + (q.listen && opt.say ? '<button class="lk-btn" type="button" data-lk-say>英語を聞く<\/button>' : '')
          + '<form data-lk-form>' + ord.map(k => '<label class="lk-ch"><input type="radio" name="lkq" value="' + k + '"><span>' + esc(q.choices[k]) + '<\/span><\/label>').join('')
          + '<div class="lk-row"><button class="lk-btn lk-strong" type="submit">答える<\/button><button class="lk-btn" type="button" data-lk-stop>やめる<\/button><\/div><\/form><div data-lk-out><\/div><\/div>';
        const sy = area.querySelector('[data-lk-say]'); if (sy) sy.addEventListener('click', () => opt.say(q.listen));
        area.querySelector('[data-lk-stop]').addEventListener('click', () => { reviewing = false; draw(); });
        area.querySelector('[data-lk-form]').addEventListener('submit', e => {
          e.preventDefault();
          const sel = area.querySelector('input[name="lkq"]:checked'); if (!sel) return;
          const v = +sel.value, ok = v === q.answer; mark(keys[idx], ok); save();
          area.querySelector('[data-lk-form] .lk-row').remove(); area.querySelectorAll('input[name="lkq"]').forEach(x => { x.disabled = true; });
          area.querySelector('[data-lk-out]').innerHTML = '<div class="lk-res ' + (ok ? 'lk-ok' : 'lk-ng') + '"><b>' + (ok ? '正解！ 箱から抜けました' : 'もう一歩（正解: ' + esc(q.choices[q.answer]) + '）') + '<\/b>'
            + (q.explain ? '<br>' + esc(q.explain) : '') + feedback(q, v, ok) + '<\/div><div class="lk-row"><button class="lk-btn lk-strong" type="button" data-lk-next>' + (idx + 1 < keys.length ? '次の問い' : '終わる') + '<\/button><\/div>';
          area.querySelector('[data-lk-next]').addEventListener('click', () => { idx++; show(); });
        });
      };
      show();
    }

    // last(): 1 問ごとの最後の結果の写し { '<段の id>#<問の番号>': 1（正解）| 0（不正解） }。分野より細かい集計（中分類のレーダーなど）に使う
    return { feedback, record, draw, stats, review, box: () => Object.keys(st.box).filter(qOf), last: () => Object.assign({}, st.last) };
  }
  window.LearnKit = { create };
})();
</script>

<script type="text/plain" class="app-js">
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=null, S={units:{},skip:{},placement:{}}, cur=null, db=null, uid=null, sample=null, tts=null;
const KEY=()=> 'learn-progress-'+(P&&P.programId||'x');

/* ---------- 保存（db があれば本人だけの場所、無ければこの端末） ---------- */
async function load(){
  try{const v=localStorage.getItem(KEY()); if(v) S=Object.assign(S,JSON.parse(v));}catch(e){}
  setSave('この端末のブラウザに保存しています');
  try{
    if(window.claude&&claude.use){
      const user=await claude.use('user'); db=await claude.use('db');
      if(user&&db){uid=await user.id(); if(uid){
        const snap=await db.collection('data/users/'+uid).doc('progress-'+P.programId).get();
        if(snap.exists){const got=Object.assign({units:{},skip:{},placement:{}},snap.data()); for(const [k,v] of Object.entries(S.units)){ if(!got.units[k]||(v.tries||0)>(got.units[k].tries||0)) got.units[k]=v; } S=got; setSave('あなたの学習記録を読み込みました（どの端末からでも続きができます）');}
        else setSave('学習記録はあなただけが見られる場所に保存されます');
      }}else setSave('この端末のブラウザに保存しています');
    }
  }catch(e){setSave('この端末のブラウザに保存しています');}
}
let saving=null;
async function save(){
  try{localStorage.setItem(KEY(),JSON.stringify(S));}catch(e){}
  if(db&&uid){
    try{ saving=db.collection('data/users/'+uid).doc('progress-'+P.programId).set(JSON.parse(JSON.stringify(S))); await Promise.race([saving,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),10000))]); setSave('保存しました（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）'); }
    catch(e){ setSave('サーバーに保存できませんでした。この端末には保存しています'); }
  }
}
function setSave(t){ $('#savestate').textContent=t; }

/* ---------- 状態 ---------- */
function status(id){
  const r=S.units[id];
  if(r&&r.best===r.total) return 'pass';
  if(r&&r.last!==undefined){ return (r.total-r.last)<=1 && r.last>0 ? 'near':'fail'; }
  if(S.skip[id]) return 'skip';
  return 'todo';
}
function units(){return P.units;}
function byId(id){return P.units.find(u=>u.id===id);}
function prevUnit(u){return P.units.find(x=>x.field===u.field&&x.level===u.level-1);}
function nextTodo(){
  const order=[...P.units].sort((a,b)=>a.level-b.level||a.field.localeCompare(b.field));
  return order.find(u=>['near','fail'].includes(status(u.id))) || order.find(u=>status(u.id)==='todo') || null;
}
function meters(){
  let p=0,t=0,l=0; for(const u of P.units){const s=status(u.id); if(s==='pass')p++; else if(s==='near'||s==='fail')t++; else l++;}
  $('#m-pass').textContent=p; $('#m-todo').textContent=t; $('#m-left').textContent=l;
}

/* ---------- マス目 ---------- */
function bandOf(l){const b=(P.bands||[[1,5,'基礎'],[6,10,'実践'],[11,15,'応用']]).find(b=>l>=b[0]&&l<=b[1]); return b?b[2]:'';}
function drawGrid(){
  const maxL=Math.max(...P.units.map(u=>u.level));
  let h='<thead><tr><th></th>';
  for(let l=1;l<=maxL;l++) h+='<th>'+l+(l===1||bandOf(l)!==bandOf(l-1)?'<div class="band">'+esc(bandOf(l))+'</div>':'')+'</th>';
  h+='</tr></thead><tbody>';
  for(const [f,name] of Object.entries(P.fields)){
    h+='<tr><th class="fname" scope="row">'+esc(f)+' '+esc(name)+'</th>';
    for(let l=1;l<=maxL;l++){const u=P.units.find(x=>x.field===f&&x.level===l);
      if(!u){h+='<td></td>';continue;}
      const s=status(u.id);
      h+='<td><button type="button" data-id="'+u.id+'" class="st-'+s+(cur&&cur.id===u.id?' cur':'')+'" title="'+esc(u.id+' '+u.title)+'" aria-label="'+esc(u.id+' '+u.title)+'">'+esc(u.id)+({pass:'〇',near:'△',fail:'✕',skip:'－'}[s]||'')+'</button></td>';}
    h+='</tr>';
  }
  $('#grid').innerHTML=h+'</tbody>';
  meters(); drawJourney();
}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('button[data-id]'); if(b) openUnit(b.dataset.id);});
$('#go-next').addEventListener('click',()=>{const n=nextTodo(); if(n) openUnit(n.id); else $('#unit').innerHTML='<div class="empty">全部のコマに合格しています。</div>';});

/* ---------- 位置確認 ---------- */
function drawPlace(){
  if(!P.placement) return;
  let h='<details><summary>はじめに：自分の位置を確かめる</summary><p class="sub">'+esc(P.placement.note||'')+'</p>';
  P.placement.items.forEach((it,i)=>{
    h+='<div class="pq"><input type="checkbox" id="pl'+i+'" '+(S.placement[i]?'checked':'')+'><label for="pl'+i+'">'+esc(it.label)+'</label></div>';
  });
  h+='<div class="row"><button class="btn ghost" type="button" id="pl-apply">結果をマス目に反映</button></div></details>';
  $('#place').innerHTML=h;
  $('#pl-apply').addEventListener('click',()=>{
    S.skip={};
    P.placement.items.forEach((it,i)=>{const on=$('#pl'+i).checked; S.placement[i]=on; if(on) for(const id of it.skip) if(!(P.placement.required||[]).includes(id)) S.skip[id]=true;});
    save(); drawGrid();
  });
}

/* ---------- コマ ---------- */
function shuffleIdx(n){const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}
let order=[], chosen=[], kit=null;
function openUnit(id){
  cur=byId(id); drawGrid();
  const u=cur, r=S.units[id];
  order=u.questions.map(q=>q.choices?shuffleIdx(q.choices.length):null);
  let h='<div class="row"><span class="tag">'+esc(u.id)+' ・ '+esc(P.fields[u.field])+' ・ '+esc(bandOf(u.level))+'</span></div>';
  h+='<h2 style="margin-top:6px">'+esc(u.title)+'</h2>';
  h+='<dl class="info"><dt>終わりの目安</dt><dd>'+esc(u.goal)+'</dd>';
  if(u.method) h+='<dt>学び方</dt><dd>'+esc(u.method)+'</dd>';
  if(u.agent&&u.agent!=='—') h+='<dt>'+esc(P.agentLabel||'使う係')+'</dt><dd>'+esc(u.agent)+'</dd>';
  if(u.ref&&u.ref!=='—') h+='<dt>参考</dt><dd>'+esc(u.ref)+'</dd>';
  h+='</dl><div class="learn"><b>要点</b><br>'+esc(u.learn)+'</div>';
  if(u.teach) h+='<details><summary class="sub">指導の要点（先生向け）</summary><p>'+esc(u.teach)+'</p></details>';
  h+='<form id="qform"><h3 style="margin-top:14px">理解度テスト（'+u.questions.length+' 問）</h3>';
  u.questions.forEach((q,i)=>{
    h+='<div class="q" id="q'+i+'"><p><b>問'+(i+1)+'</b> '+esc(q.q)+'</p>';
    if(q.listen) h+='<div class="row" style="margin-bottom:6px"><button class="btn ghost speak" type="button" data-say="'+i+'">英語を聞く</button><span class="sub">何度でも聞けます</span></div>';
    if(q.type==='write'){ h+='<textarea id="w'+i+'" aria-label="答え"></textarea>'; }
    else order[i].forEach(k=>{ h+='<label><input type="radio" name="a'+i+'" value="'+k+'"><span>'+esc(q.choices[k])+'</span></label>'; });
    h+='<div id="r'+i+'"></div></div>';
  });
  h+='<div class="row" style="margin-top:14px"><button class="btn" type="submit" id="grade">採点する</button></div></form><div id="verdict"></div>';
  if(r) h+='<p class="hist">これまで: '+r.tries+' 回／最高 '+r.best+'/'+r.total+'／前回 '+r.last+'/'+r.total+'（'+esc(r.date||'')+'）</p>';
  $('#unit').innerHTML=h;
  $('#unit').querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>say(u.questions[+b.dataset.say].listen)));
  $('#qform').addEventListener('submit',e=>{e.preventDefault(); grade();});
  if(window.innerWidth<900) $('#unit').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 音声（英語） ---------- */
async function say(text){
  { const p=playA('|'+text); if(p) return p; }
  try{ if(!tts&&window.claude&&claude.use) tts=await claude.use('tts'); if(tts){ await tts.speak(text,{language:'en',rate:0.9}); return; } }catch(e){}
  try{ const m=new SpeechSynthesisUtterance(text); m.lang='en-US'; m.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(m);}catch(e){}
}

/* ---------- 記述の採点（Claude に見てもらう） ---------- */
async function gradeWrite(q,ans){
  if(!ans.trim()) return {ok:false,msg:'答えが空です。'};
  try{
    if(!sample&&window.claude&&claude.use) sample=await claude.use('sample');
    if(sample){
      const prompt='あなたは中学・高校の英語の先生です。次の課題への生徒の答えを採点してください。\n課題: '+q.q+'\n採点の観点: '+(q.rubric||'')+'\n模範解答の例: '+(q.model||'')+'\n生徒の答え: '+ans+'\n\nJSON だけで答えてください: {"pass": true か false, "comment": "日本語で2〜3文。良い点と直す点", "fixed": "直した英文"}';
      const v=await sample.json(prompt,{modelTier:'quick'});
      return {ok:!!v.pass,msg:(v.comment||'')+(v.fixed?'\n直した例: '+v.fixed:'')};
    }
  }catch(e){}
  return {ok:null,msg:'自動の採点が使えない画面です。下の模範解答と見比べて、自分で〇か×を決めてください。'};
}

/* ---------- 採点と学び直し ---------- */
async function grade(){
  const u=cur; $('#grade').disabled=true; chosen=[];
  const res=[];
  for(let i=0;i<u.questions.length;i++){
    const q=u.questions[i];
    if(q.type==='write'){
      const ans=$('#w'+i).value; $('#r'+i).innerHTML='<div class="res">採点しています…</div>';
      const g=await gradeWrite(q,ans);
      const tail='<br><b>模範解答の例</b> '+esc(q.model||'')+'<br><b>解説</b> '+esc(q.explain);
      if(g.ok===null){
        res[i]=null;
        $('#r'+i).innerHTML='<div class="res">'+esc(g.msg)+tail+'<div class="row" style="margin-top:6px"><button class="btn ghost speak" type="button" data-self="'+i+'" data-v="1">合っていた</button><button class="btn ghost speak" type="button" data-self="'+i+'" data-v="0">違っていた</button></div></div>';
      }else{
        res[i]=!!g.ok;
        $('#r'+i).innerHTML='<div class="res '+(g.ok?'ok':'ng')+'"><b>'+(g.ok?'合格':'もう一歩')+'</b><br>'+esc(g.msg).replace(/\n/g,'<br>')+tail+(kit?kit.feedback(q,-1,!!g.ok):'')+'</div>';
      }
    }else{
      const sel=document.querySelector('input[name="a'+i+'"]:checked');
      const v=sel?+sel.value:-1, ok=v===q.answer; res[i]=ok; chosen[i]=v;
      $('#r'+i).innerHTML='<div class="res '+(ok?'ok':'ng')+'"><b>'+(ok?'正解':(v<0?'未回答':'不正解'))+'</b>'+(ok?'':'（正解: '+esc(q.choices[q.answer])+'）')+'<br><b>解説</b> '+esc(q.explain)+(q.listen?'<br><b>流れた英語</b> '+esc(q.listen):'')+(kit?kit.feedback(q,v,ok):'')+'</div>';
    }
  }
  if(res.some(x=>x===null)){
    $('#verdict').innerHTML='<div class="verdict near"><p>書いた問題は、模範解答と見比べて「合っていた／違っていた」を押してください。押すと採点が決まります。</p></div>';
    $('#unit').querySelectorAll('[data-self]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.self; res[i]=b.dataset.v==='1';
      b.parentElement.innerHTML='<b>'+(res[i]?'自分で〇':'自分で×')+'</b>';
      if(!res.some(x=>x===null)) finish(u,res);
    }));
    $('#grade').disabled=false; return;
  }
  await finish(u,res);
}
async function finish(u,res){
  const _jb=jSnap();
  const wrong=[]; let correct=0; res.forEach((ok,i)=>{ if(ok) correct++; else wrong.push(i); });
  const total=u.questions.length, r=S.units[u.id]||{tries:0,best:0};
  r.tries++; r.last=correct; r.total=total; r.best=Math.max(r.best||0,correct); r.date=new Date().toLocaleDateString('ja-JP'); r.wrong=wrong;
  S.units[u.id]=r; delete S.skip[u.id];
  drawGrid(); save(); jCelebrate(_jb);
  if(kit) kit.record(u,res,chosen);
  $('#verdict').innerHTML=verdictHTML(u,correct,total,wrong);

  window.__PROGRAM__=d.program; window.__JOURNEYS__=d.journeys||[]; window.__IMG__={}; window.__AUDIO__={};
  $('#lock').remove(); document.body.classList.remove('locked');
  for(const old of document.querySelectorAll('script.app-js')){ const s=document.createElement('script'); s.textContent=old.textContent; document.body.appendChild(s); }
  const fill=async(map,dst,mime)=>{ for(const [k,f] of Object.entries(map||{})){ try{ dst[k]=URL.createObjectURL(new Blob([await open(key,await get(f))],{type:mime})); }catch(e){} } };
  await fill(d.img,window.__IMG__,'image/jpeg'); if(window.__REDRAW__) window.__REDRAW__();
  await fill(d.audio,window.__AUDIO__,'audio/mpeg');
}
let saved=null; try{ const v=JSON.parse(localStorage.getItem(STORE)||'null'); if(v&&v.id===KEYID) saved=b64(v.k); }catch(e){}
if(saved){ try{ await boot(saved); return; }catch(e){} }
$('#lock').hidden=false;
$('#lockf').addEventListener('submit',async e=>{
  e.preventDefault(); const m=$('#lock .msg'); m.textContent='確かめています…';
  try{
    const raw=await unwrap($('#pass').value);
    if(!raw){ m.textContent='合言葉が違います。'; return; }
    if($('#remember').checked){ try{ localStorage.setItem(STORE,JSON.stringify({id:KEYID,k:btoa(String.fromCharCode(...raw))})); }catch(e){} }
    await boot(raw);
  }catch(err){ m.textContent='開けませんでした。電波のある所で開き直してください。'; }
});
})();
</script>
